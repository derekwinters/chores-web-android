# Issue #15 (design-token rollout iteration 5): records Roborazzi snapshot goldens on a CI
# runner and commits them back to the given branch. Goldens must be recorded here rather than
# on developer machines so the pixels come from the same environment pr.yml's
# verifyRoborazziDebug step compares against (same OS/font stack -> deterministic rendering).
# Usage: Actions -> "Record Snapshots" -> Run workflow -> enter the branch name.
# See docs/snapshot-testing.md.
name: Record Snapshots

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to record snapshot goldens on (goldens are committed back to this branch)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # Explicit packages: the action's default list includes the obsolete 'tools' package,
        # which fails on current runners ("Failed to find package 'tools'"). The platform
        # matches compileSdk in app/build.gradle.kts (from API 37 the id carries a minor
        # version); build-tools also provides apksigner for the release-signature gate.
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Record snapshot goldens
        run: ./gradlew recordRoborazziDebug
        env:
          # Needed for the design-tokens Maven repo (GitHub Packages) — see settings.gradle.kts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots
          if git diff --cached --quiet; then
            echo "No golden changes to commit."
          else
            git commit -m "test: record snapshot goldens [skip ci]"
            git push origin HEAD:${{ inputs.ref }}
          fi
