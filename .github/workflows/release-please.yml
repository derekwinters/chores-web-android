name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # Issue #18: the release APK is built here, in the same run that creates the release,
  # rather than in a tag-push workflow. Release Please creates its tags with the default
  # GITHUB_TOKEN, and GitHub never fires workflows from GITHUB_TOKEN-initiated events —
  # so a "on: push: tags" workflow silently never runs for automated releases. Building
  # in this run needs no PAT and cannot miss the tag.
  build-and-attach:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Issue #52 (ADR-0008): fail loudly, before anything is built, if any release signing
      # secret is missing. Without them Gradle would produce an unsigned APK at best.
      - name: Check the release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_SHA256: ${{ secrets.ANDROID_KEYSTORE_SHA256 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEYSTORE_SHA256 \
                      ANDROID_KEY_ALIAS ANDROID_KEY_ALIAS_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing::Repository secret $name is missing or empty."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to build a release without the stable release keystore (ADR-0008)."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The release-signature gate is run from a separate checkout of main, so building an
      # older ref (e.g. backfilling an old tag) still runs the current gate.
      - name: Check out main for the release-signature gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verification-gate

      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        # Explicit packages: the action's default list includes the obsolete 'tools' package,
        # which fails on current runners ("Failed to find package 'tools'"). The platform
        # matches compileSdk in app/build.gradle.kts (from API 37 the id carries a minor
        # version); build-tools also provides apksigner for the release-signature gate.
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Gradle needs a keystore file, not the base64 secret. The decoded file lives only in this
      # job's runner temp directory, is never logged, and is removed below.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # app/build.gradle.kts signs release from these env vars (plus ANDROID_KEYSTORE_PATH set
      # above), with v1/v2/v3 schemes, and never falls back to the debug key.
      - name: Build the signed release APK
        run: ./gradlew assembleRelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # Refuses to publish anything not signed by exactly the pinned release certificate
      # (ANDROID_KEYSTORE_SHA256), and names a debug-key fallback explicitly. Runs before any
      # upload or attach, from the main checkout above.
      - name: Verify the release signature
        env:
          ANDROID_KEYSTORE_SHA256: ${{ secrets.ANDROID_KEYSTORE_SHA256 }}
        run: >-
          python3 verification-gate/.github/scripts/verify_release_signature.py
          app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: app/build/outputs/apk/release/*.apk
